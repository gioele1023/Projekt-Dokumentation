
name: Secret Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Check repository secret
        env:
          PROJECT_MESSAGE: ${{ secrets.PROJECT_MESSAGE }}
        run: |
          if [ -n "$PROJECT_MESSAGE" ]; then
            echo "Das Repository Secret ist verfügbar!"
          else
            echo "Das Repository Secret fehlt."
            exit 1
          fi
